<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PyQuests - 코딩 마스터로 가는 가장 빠른 지름길. 기초부터 고급까지 문제를 풀고 브라우저에서 바로 코드를 실행해 보세요." />
    <title>PyQuests | 코딩 마스터 지름길</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Pyodide WASM Python Runtime -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <!-- Apply saved dark mode before first paint to avoid a light-mode flash -->
    <script>
      try {
        if (localStorage.getItem('pyquests_dark_mode') === 'true') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
